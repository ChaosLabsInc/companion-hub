[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-backup"
version = "0.1.0"
description = "Syncs your agent's memory to your own endpoint, on a schedule"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Companion Hub" }]
requires-python = ">=3.10"
dependencies = []
classifiers = ["Programming Language :: Python :: 3"]
keywords = ["agents", "memory", "backup", "sync"]

[project.urls]
Homepage = "https://github.com/ChaosLabsInc/agent-eval-baseline"
Repository = "https://github.com/ChaosLabsInc/companion-hub"
