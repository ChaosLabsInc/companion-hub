[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchsync"
version = "0.4.0"
description = "Benchmark results + environment reporter — registers runs and syncs results to the results repo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Companion Hub" }]
requires-python = ">=3.10"
dependencies = []
classifiers = ["Programming Language :: Python :: 3"]
keywords = ["benchmarks", "results", "reporter"]

[project.urls]
Homepage = "https://github.com/ChaosLabsInc/agent-eval-baseline"
Repository = "https://github.com/ChaosLabsInc/companion-hub"

[tool.setuptools.packages.find]
include = ["benchsync*"]
